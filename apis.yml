name: Tidemark
description: >-
  Tidemark is enterprise financial and operational planning software for
  continuous, extended, and driver-based planning. It provides scenario
  ("what-if") modeling, workflow and approvals, and real-time data
  integration across 140+ ERP and EPM systems for budgeting, forecasting,
  and strategic planning. Founded as a venture-backed cloud analytics and
  enterprise performance management (EPM) company and counted among the
  Andreessen Horowitz (a16z) portfolio, Tidemark was later acquired and is
  now offered as a product within the insightsoftware family. It has no
  publicly documented API, SDK, or developer portal; integration is
  delivered through pre-built ERP/EPM connectors rather than a public
  developer program.
